[project]
name = "ppac-energy-intelligence-agent"
version = "0.1.0"
description = "Autonomous Petroleum Planning, Econometric Forecasting & Statutory Reporting for MoPNG"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "google-cloud-storage>=2.18.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.156.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore:.*StarletteDeprecationWarning.*",
]
